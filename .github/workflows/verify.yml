name: Build and verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tools/verification/verify.sh
      - run: python3 tools/verification/postgres_application_drill.py
      - name: Build immutable images only after checks pass
        if: github.event_name == 'push'
        run: |
          for service in auth config gateway hr member test trace; do
            docker build -f deploy/Dockerfile --build-arg SERVICE=$service-service --build-arg REVISION=${{ github.sha }} -t msa/$service-service:${{ github.sha }} .
          done
      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            **/build/test-results/test/*.xml
            build/verification/next/*/report.json
            build/verification/postgres/*/report.json
          retention-days: 14
