groups:
  - name: msa
    rules:
      - alert: MsaCollectorUnobserved
        expr: up{job="msa-gateway"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Gateway metrics unavailable"}
      - alert: MsaHighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1) > 0.05
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "HTTP 5xx ratio exceeds trial threshold"}
