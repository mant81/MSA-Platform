spring:
  application:
    name: member-service
  datasource:
    url: jdbc:h2:mem:memberdb;MODE=MariaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 500
            readTimeout: 1000
  sql:
    init:
      mode: never

app:
  database-type: H2
  datasource-url: jdbc:h2:mem:memberdb;MODE=MariaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  datasource-driver: org.h2.Driver
  datasource-username: sa
  datasource-password:
  trace-service-url: http://localhost:8090

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  shutdown: graceful
  address: 127.0.0.1
  port: 8083

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
